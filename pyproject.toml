[project]
name = "yt-mcp"
version = "0.1.0"
description = "MCP server for YouTube channel search, video listings, transcripts and descriptions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "google-api-python-client>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "youtube-transcript-api>=1.0",
]

[project.scripts]
yt-mcp = "yt_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.ruff.lint]
extend-select = [
    "D",    # pydocstyle — documentation
    "C90",  # mccabe — cyclomatic complexity (needs max-complexity below)
    "B",    # flake8-bugbear — likely bugs & design issues
    "S",    # flake8-bandit — security
    "EM",   # flake8-errmsg — exception message formatting
    "TRY",  # tryceratops — exception handling antipatterns
    "PTH",  # flake8-use-pathlib — prefer pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
# Assertions are how pytest tests assert; the private helpers under test are
# deliberately private.
"tests/*" = ["S101", "SLF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"
